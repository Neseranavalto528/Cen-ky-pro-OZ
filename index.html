<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyhledávač v Katalogu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .search-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            text-align: center;
        }
        h1 {
            color: #111827;
            font-size: 28px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .search-group {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        .search-box {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #3b82f6;
        }
        .search-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: #2563eb;
        }
        .results-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 15px;
        }
        th {
            background-color: #f9fafb;
            color: #4b5563;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #f9fafb;
        }
        .artikl-code {
            font-family: monospace;
            background-color: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            color: #374151;
        }
        .cena-text {
            font-weight: 700;
            color: #059669;
        }
        .info-msg {
            text-align: center;
            color: #6b7280;
            padding: 40px 20px;
            font-size: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="search-card">
        <h1>Interní Vyhledávač Produktů</h1>
        <p class="subtitle">Vyhledávání podle artiklu nebo názvu produktu</p>
        
        <div class="search-group">
            <input type="text" id="hledat" class="search-box" placeholder="Zadejte kód artiklu nebo název..." autofocus>
            <button id="hledat-btn" class="search-btn">Hledat</button>
        </div>
    </div>

    <div id="vystup-sekce">
        <div class="info-msg" id="stav-text">Aplikace je připravena. Zadejte hledaný výraz výše.</div>
    </div>

</div>

<script>
    const SOUBOR_JSON = 'tableConvert.com_wur85z.json';
    let vsechnaData = [];
    let nacteno = false;

    async function inicializujData() {
        try {
            const odpoved = await fetch(SOUBOR_JSON);
            if (!odpoved.ok) throw new Error();
            vsechnaData = await odpoved.json();
            nacteno = true;
            console.log("Data načtena do paměti.");
        } catch (chyba) {
            document.getElementById('stav-text').innerText = "Chyba: Nepodařilo se načíst soubor " + SOUBOR_JSON;
            document.getElementById('stav-text').style.color = "#dc2626";
        }
    }

    function provedVyhledavani() {
        if (!nacteno) {
            alert("Data se ještě načítají, vteřinku strpení...");
            return;
        }

        const hledanyText = document.getElementById('hledat').value.trim().toLowerCase();
        
        // Odstraní ze zadaného vyhledávání úplně všechny běžné i speciální mezery (\s a \u00A0)
        const hledanyTextBezMezer = hledanyText.replace(/[\s\u00A0]/g, '');
        
        const vystupSekce = document.getElementById('vystup-sekce');

        if (hledanyText === '') {
            vystupSekce.innerHTML = '<div class="info-msg" id="stav-text">Do vyhledávacího pole jste nic nenapsal.</div>';
            return;
        }

        // Filtrování: Hledáme shodu buď vyčištěného Sloupce A, nebo textu v názvu
        const vysledky = vsechnaData.filter(radek => {
            const hodnoty = Object.values(radek);
            
            // Sloupec A (Artikl) - odstraníme z něj pro kontrolu úplně všechny druhy mezer
            const artiklA_Puvodni = hodnoty[0] !== undefined ? String(hodnoty[0]) : '';
            const artiklA_Cisty = artiklA_Puvodni.toLowerCase().replace(/[\s\u00A0]/g, '');
            
            // Sloupce C, D, E (Cenová jedn., Cena, Název) prohledáme klasicky s mezerami
            const ostatniSloupceText = hodnoty.slice(2).map(v => String(v).toLowerCase()).join(' ');

            // Najde shodu, pokud čistý artikl obsahuje hledaný text bez mezer, nebo pokud text sedí do názvu
            return artiklA_Cisty.includes(hledanyTextBezMezer) || ostatniSloupceText.includes(hledanyText);
        });

        if (vysledky.length === 0) {
            vystupSekce.innerHTML = '<div class="info-msg" id="stav-text">Nebyly nalezeny žádné produkty pro výraz: "<strong>' + vycestejText(hledanyText) + '</strong>"</div>';
            return;
        }

        // Vykreslení tabulky (Sloupec B byl vynechán podle tvého přání)
        let tabulkaHTML = `
            <div class="results-wrapper" style="display: block;">
                <table>
                    <thead>
                        <tr>
                            <th>Artikl (Sloupec A)</th>
                            <th>Cenová jedn.</th>
                            <th>Cena</th>
                            <th>Název produktu</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        const limitVysledku = vysledky.slice(0, 50);
        
        limitVysledku.forEach(radek => {
            const hodnoty = Object.values(radek);
            
            const artiklA = hodnoty[0] !== undefined ? hodnoty[0] : '';
            // Hodnotu[1] (Sloupec B) záměrně přeskakujeme
            const cenovaJednotka = hodnoty[2] !== undefined ? hodnoty[2] : '';
            const cena = hodnoty[3] !== undefined ? hodnoty[3] : '';
            const nazevProduktu = hodnoty[4] !== undefined ? hodnoty[4] : '';

            tabulkaHTML += `
                <tr>
                    <td><span class="artikl-code">${artiklA}</span></td>
                    <td>${cenovaJednotka}</td>
                    <td class="cena-text">${cena}</td>
                    <td><strong>${nazevProduktu}</strong></td>
                </tr>
            `;
        });

        tabulkaHTML += `
                    </tbody>
                </table>
            </div>
        `;

        if (vysledky.length > 50) {
            tabulkaHTML += `<div style="text-align: center; color: #6b7280; font-size: 13px; margin-top: 15px;">Zobrazeno prvních 50 výsledků z celkem ${vysledky.length}. Upřesněte vyhledávání.</div>`;
        }

        vystupSekce.innerHTML = tabulkaHTML;
    }

    function vycestejText(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('hledat-btn').addEventListener('click', provedVyhledavani);
    document.getElementById('hledat').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            provedVyhledavani();
        }
    });

    inicializujData();
</script>

</body>
</html>
