<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interní Vyhledávač – Spojovací Materiál & Nářadí</title>
    <style>
        /* Moderní industriální vzhled (Tmavě šedá + Bezpečnostní Oranžová/Žlutá) */
        :root {
            --primary-color: #1e293b; /* Tmavá břidlicová */
            --accent-color: #f59e0b;  /* Industriální oranžovo-žlutá */
            --bg-color: #f8fafc;      /* Světlé pozadí */
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Horní vyhledávací panel */
        .search-card {
            background: var(--primary-color);
            color: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
        }

        .search-card h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .search-card p.subtitle {
            color: #94a3b8;
            margin: 0 0 25px 0;
            font-size: 14px;
        }

        .search-group {
            display: flex;
            gap: 10px;
            max-width: 650px;
            margin: 0 auto;
        }

        .search-box {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #334155;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background-color: #334155;
            color: #ffffff;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-color);
            background-color: #475569;
        }

        .search-box::placeholder {
            color: #94a3b8;
        }

        .search-btn {
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none;
            padding: 0 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
        }

        .search-btn:hover {
            background-color: #d97706;
        }

        /* Výpis výsledků */
        #vystup-sekce {
            margin-top: 20px;
        }

        .info-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 15px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px dashed #cbd5e1;
        }

        /* --- MOBILNÍ ZOBRAZENÍ (KARTIČKY POD SEBOU) --- */
        .mobile-cards-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-left: 5px solid var(--accent-color);
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .card-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-value {
            font-size: 14px;
            font-weight: 500;
            text-align: right;
        }

        .artikl-badge {
            font-family: monospace;
            background-color: #f1f5f9;
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--text-dark);
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            white-space: nowrap;
        }

        .cena-badge {
            font-weight: 800;
            color: #16a34a;
            font-size: 16px;
        }

        .nazev-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            text-align: left;
            line-height: 1.4;
        }

        /* --- TABLET / PC ZOBRAZENÍ (KLASICKÁ TABULKA) --- */
        .desktop-table-wrapper {
            display: none;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        @media (min-width: 768px) {
            body {
                padding: 40px 20px;
            }
            .search-card h1 {
                font-size: 32px;
            }
            .mobile-cards-container {
                display: none;
            }
            .desktop-table-wrapper {
                display: block;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="search-card">
        <h1>Katalog Materiálu & Nářadí</h1>
        <p class="subtitle">Zadejte kód artiklu na číselníku</p>
        
        <div class="search-group">
            <input type="text" 
                   inputmode="numeric" 
                   pattern="[0-9]*" 
                   id="hledat" 
                   class="search-box" 
                   placeholder="Zadejte kód artiklu..." 
                   autofocus>
            <button id="hledat-btn" class="search-btn">Hledat</button>
        </div>
    </div>

    <div id="vystup-sekce">
        <div class="info-msg" id="stav-text">Systém je připraven. Zadejte hledaný výraz výše.</div>
    </div>

</div>

<script>
    const SOUBOR_JSON = 'tableConvert.com_wur85z.json';
    let vsechnaData = [];
    let nacteno = false;

    async function inicializujData() {
        try {
            const odpoved = await fetch(SOUBOR_JSON);
            if (!odpoved.ok) throw new Error();
            vsechnaData = await odpoved.json();
            nacteno = true;
            console.log("Data skladu úspěšně připravena.");
        } catch (chyba) {
            document.getElementById('stav-text').innerText = "Chyba: Nepodařilo se načíst datový soubor " + SOUBOR_JSON;
            document.getElementById('stav-text').style.color = "#ef4444";
        }
    }

    function provedVyhledavani() {
        if (!nacteno) {
            alert("Data se stále načítají, moment...");
            return;
        }

        const hledatInput = document.getElementById('hledat');
        const hledanyText = hledatInput.value.trim().toLowerCase();
        
        const hledanyTextBezMezer = hledanyText.replace(/[\s\u00A0]/g, '');
        const vystupSekce = document.getElementById('vystup-sekce');

        if (hledanyText === '') {
            vystupSekce.innerHTML = '<div class="info-msg">Zadejte do vyhledávače číslo artiklu.</div>';
            return;
        }

        const vysledky = vsechnaData.filter(radek => {
            const hodnoty = Object.values(radek);
            const artiklA_Puvodni = hodnoty[0] !== undefined ? String(hodnoty[0]) : '';
            const artiklA_Cisty = artiklA_Puvodni.toLowerCase().replace(/[\s\u00A0]/g, '');
            
            const ostatniSloupceText = hodnoty.slice(2).map(v => String(v).toLowerCase()).join(' ');

            return artiklA_Cisty.includes(hledanyTextBezMezer) || ostatniSloupceText.includes(hledanyText);
        });

        if (vysledky.length === 0) {
            vystupSekce.innerHTML = '<div class="info-msg">Nebylo nalezeno žádné zboží odpovídající výrazu: "<strong>' + vycestejText(hledanyText) + '</strong>"</div>';
            return;
        }

        const limitVysledku = vysledky.slice(0, 50);

        let mobilniHTML = '<div class="mobile-cards-container">';
        let desktopHTML = `
            <div class="desktop-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Artikl</th>
                            <th>Cenová jedn.</th>
                            <th>Cena</th>
                            <th>Název produktu</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        limitVysledku.forEach(radek => {
            const hodnoty = Object.values(radek);
            
            const artiklA = hodnoty[0] !== undefined ? hodnoty[0] : '';
            const cenovaJednotka = hodnoty[2] !== undefined ? hodnoty[2] : '';
            const cena = hodnoty[3] !== undefined ? hodnoty[3] : '';
            const nazevProduktu = hodnoty[4] !== undefined ? hodnoty[4] : '';

            mobilniHTML += `
                <div class="product-card">
                    <div class="card-row">
                        <span class="card-label">Artikl</span>
                        <span class="card-value"><span class="artikl-badge">${artiklA}</span></span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Cenová jedn.</span>
                        <span class="card-value">${cenovaJednotka}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Cena</span>
                        <span class="card-value"><span class="cena-badge">${cena}</span></span>
                    </div>
                    <div style="margin-top: 10px; padding-top: 5px;">
                        <span class="card-label" style="display:block; margin-bottom: 4px;">Název produktu</span>
                        <div class="nazev-text">${nazevProduktu}</div>
                    </div>
                </div>
            `;

            desktopHTML += `
                <tr>
                    <td><span class="artikl-badge">${artiklA}</span></td>
                    <td>${cenovaJednotka}</td>
                    <td><span class="cena-badge">${cena}</span></td>
                    <td class="nazev-text">${nazevProduktu}</td>
                </tr>
            `;
        });

        mobilniHTML += '</div>';
        desktopHTML += '</tbody></table></div>';

        let finalniHTML = mobilniHTML + desktopHTML;

        if (vysledky.length > 50) {
            finalniHTML += `<div style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px; font-weight: 500;">Zobrazeno prvních 50 položek z celkem ${vysledky.length}.</div>`;
        }

        vystupSekce.innerHTML = finalniHTML;
        hledatInput.blur();
    }

    function vycestejText(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('hledat-btn').addEventListener('click', provedVyhledavani);
    document.getElementById('hledat').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            provedVyhledavani();
        }
    });

    inicializujData();
</script>

</body>
</html>
